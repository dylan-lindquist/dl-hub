<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="refresh" content="__REFRESH__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<title>Lindquist Hub</title>
<!-- legacy Google Fonts endpoint serves iOS 9-compatible formats; Helvetica fallback if it can't -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Plus+Jakarta+Sans:700,800&display=swap">
<style>
/* ---- 4:3 wall board for iPad Mini (1024x768), iOS 9 Safari. Light/modern.
   7-col x 2-row fortnight grid (today's week on top, tail days wrapped & shaded).
   NO flex `gap`, NO max()/env()/padding-block, flex uses `1 1 0%` — all Safari-9-safe. ---- */
:root{
  --paper:#F4F1E8;--cell:#FFFFFF;--line:#E6E1D4;--ink:#242321;--muted:#6E665A;
  --today:#C9462E;--wrap:#ECE7DA;--wrap-line:#D4CCBA;--pill:#EBE4D6;--wxink:#3F4854;
  --font:"Plus Jakarta Sans","Helvetica Neue","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;overflow:hidden;}
body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;padding:14px 16px;}
.board{width:100%;height:100%;display:flex;flex-direction:column;}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;flex:none;margin-bottom:14px;}
.date .dow{font-weight:800;font-size:33px;line-height:.95;letter-spacing:-.02em;}
.date .full{font-weight:700;font-size:15px;color:var(--muted);margin-top:4px;}
.suncenter{display:flex;align-items:center;}
.suncell{display:flex;align-items:center;font-size:17px;font-weight:800;color:var(--ink);}
.suncell + .suncell{margin-left:22px;}
.sun-ic{width:22px;height:22px;margin-right:7px;color:var(--ink);}
.wx-strip{display:flex;}
.wx{min-width:70px;background:var(--cell);border:1px solid var(--line);border-radius:16px;padding:10px 9px 9px;text-align:center;display:flex;flex-direction:column;align-items:center;}
.wx + .wx{margin-left:8px;}
.wx .d{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.wx svg{width:36px;height:36px;display:block;margin-bottom:5px;color:var(--wxink);}
.wx .t{font-size:13px;font-weight:800;}
.wx .t .lo{color:var(--muted);font-weight:700;}

/* grid */
.grid{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
.gridhead{display:flex;flex:none;}
.gh{flex:1 1 0%;min-width:0;margin:0 5px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 0 7px 3px;}
.gridrow{display:flex;flex:1 1 0%;min-height:0;}
.cell{flex:1 1 0%;min-width:0;display:flex;}
.cellbox{flex:1 1 0%;margin:5px;background:var(--cell);border:1px solid var(--line);border-radius:14px;padding:9px 10px;overflow:hidden;display:flex;flex-direction:column;}
.cellbox.wrap{background:var(--wrap);border-color:var(--wrap-line);}
.cellbox.today{border:2px solid var(--today);padding:8px 9px;}
.daynum{display:flex;align-items:center;flex:none;margin-bottom:7px;height:26px;}
.daynum .d{font-weight:800;font-size:17px;color:var(--ink);line-height:1;}
.cellbox.wrap .daynum .d{color:var(--muted);}
.cellbox.today .daynum .d{background:var(--today);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.evs{flex:1 1 0%;min-height:0;overflow:hidden;}
.ev{margin-bottom:6px;}
.ev .t{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.02em;}
.ev .n{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.16;}
.ev.allday .n{background:var(--pill);border-radius:7px;padding:2px 7px;display:inline-block;font-weight:700;font-size:12px;}
.cellbox.wrap .ev .n{color:#5F5A4E;}
.more{font-size:10.5px;font-weight:800;color:var(--muted);}

/* bottom cards */
.bottom{flex:0 0 26%;display:flex;margin-top:14px;}
.card{flex:1 1 0%;background:var(--cell);border:1px solid var(--line);border-radius:18px;padding:18px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
.card .tag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
.card .line{font-weight:800;font-size:18px;line-height:1.22;color:var(--ink);}
.card .sub{display:block;margin-top:7px;font-size:14px;font-weight:600;color:var(--muted);}
.quip{flex:1 1 0%;margin-left:14px;background:var(--cell);border:1px solid var(--line);border-radius:18px;padding:18px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
.quip .line{font-weight:800;font-size:19px;line-height:1.22;letter-spacing:-.01em;color:var(--ink);}
.quip .punch{display:block;margin-top:7px;color:var(--today);}
</style>
</head>
<body>
<div class="board">

  <div class="head">
    <div class="date">
      <div class="dow">__DOW__</div>
      <div class="full">__FULLDATE__</div>
    </div>
    <div class="suncenter">
      <span class="suncell"><svg class="sun-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M2 18h20"/><path d="M12 9V3"/><path d="M9 5l3-3 3 3"/></svg>__SUNRISE__</span>
      <span class="suncell"><svg class="sun-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M2 18h20"/><path d="M12 3v6"/><path d="M9 7l3 3 3-3"/></svg>__SUNSET__</span>
    </div>
    <div class="wx-strip">__WX_CELLS__</div>
  </div>

  <div class="grid">
    <div class="gridhead">
      <div class="gh">Sun</div><div class="gh">Mon</div><div class="gh">Tue</div><div class="gh">Wed</div><div class="gh">Thu</div><div class="gh">Fri</div><div class="gh">Sat</div>
    </div>
    <div class="gridrow">__ROW1__</div>
    <div class="gridrow">__ROW2__</div>
  </div>

  <div class="bottom">
    <div class="card" id="leftcard">__LEFTCARD__</div>
    <div class="quip"><div class="line">__JOKE__</div></div>
  </div>

</div>
<script>
/* Flip the left card between the morning word and the afternoon fact at local noon.
   ES5 only (iOS 9 Safari). On weekends the baked card has no am/pm blocks, so this no-ops. */
(function(){
  function flip(){
    var amT=document.getElementById('amtag');
    if(!amT){return;} /* weekend: riddle, nothing to flip */
    var pmT=document.getElementById('pmtag'),amL=document.getElementById('amline'),pmL=document.getElementById('pmline');
    var morning=(new Date()).getHours()<12;
    amT.hidden=!morning; amL.hidden=!morning;
    pmT.hidden=morning;  pmL.hidden=morning;
  }
  flip();
  setInterval(flip,60000);
})();
</script>
</body>
</html>
